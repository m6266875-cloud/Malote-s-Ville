<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malote’s Ville — Naturally Fermented Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2e8;--beige:#ece3d1;--card:#fbf8f1;--green:#5d7a5a;--green-d:#3f5a3d;--ink:#2a2d2b;--mute:#6a6e68;--blue:#7f95a3;--gold:#b8924a;--line:#ded4bf;--r:22px;
--serif:'Fraunces',Georgia,serif;--sans:'Figtree',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f7f2e8}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{font:16px/1.65 var(--sans);color:var(--ink);background:var(--bg);background:var(--bg);-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green-d);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.12;letter-spacing:-.01em}
h2{font-size:clamp(30px,5vw,44px);margin-bottom:14px}
.lead{color:var(--mute);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;border:1.5px solid var(--green-d);transition:.2s;cursor:pointer;font-family:inherit}
.btn.p{background:var(--green-d);color:#fff}.btn.p:hover{background:var(--ink);border-color:var(--ink)}
.btn.s{background:transparent;color:var(--green-d)}.btn.s:hover{background:var(--beige)}
/* nav */
header{position:sticky;top:0;z-index:20;background:rgba(247,242,232,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--serif);font-size:23px;color:var(--green-d);font-weight:600}
.links{display:flex;gap:28px;align-items:center;font-size:15px}
.links a:not(.btn):hover{color:var(--green)}
.links .btn{padding:10px 18px}
.burger{display:none;background:none;border:1.5px solid var(--line);border-radius:12px;width:44px;height:44px;cursor:pointer}
.burger span{display:block;width:18px;height:2px;background:var(--ink);margin:4px auto}
@media(max-width:820px){.burger{display:block}
.links{position:absolute;left:0;right:0;top:100%;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;padding:8px 20px 20px;border-bottom:1px solid var(--line);display:none}
.links.open{display:flex}.links a:not(.btn){padding:14px 0;border-bottom:1px solid var(--line)}.links .btn{margin-top:14px}}
/* hero */
.hero{padding:56px 0 72px}
.hg{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.tag{font-size:12px;letter-spacing:.14em;color:var(--green);font-weight:600;margin-bottom:18px}
h1{font-size:clamp(42px,7.4vw,76px);margin-bottom:20px}
.hero p.lead{font-size:18px;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.trust{font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
.trust i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.stage{position:relative;aspect-ratio:1/1.05;border-radius:34px;background:linear-gradient(160deg,#e7dcc3,#d8cfb6);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:0 6% 0}
.stage .shelf{position:absolute;left:0;right:0;bottom:0;height:16%;background:#c9bc9b}
.stage svg{position:relative;z-index:1;margin-bottom:12%}
@media(max-width:820px){.hg{grid-template-columns:1fr}.stage{order:-1;aspect-ratio:1/.8}section{padding:56px 0}}
/* bottles */
.bt{--c:#8a5a9c;display:block;width:100%}
/* products */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid4{gap:12px}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.pc:hover{transform:translateY(-4px);border-color:var(--green)}
.pi{aspect-ratio:1/.85;background:var(--beige);display:flex;align-items:flex-end;justify-content:center;padding-top:14px;overflow:hidden}
.pi svg{width:46%;max-width:110px;margin-bottom:-2px}
.pb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:21px}.pb p{font-size:14px;color:var(--mute);flex:1}
.pb a{font-weight:600;font-size:14px;color:var(--green-d);margin-top:6px}.pb a:hover{text-decoration:underline}
/* menu */
.menu{background:var(--beige)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:26px 0 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 14px var(--sans);cursor:pointer;color:var(--ink);transition:.2s}
.tab[aria-selected=true]{background:var(--green-d);border-color:var(--green-d);color:#fff}
.mp{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 28px 24px}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px}
.mh h3{font-size:clamp(26px,4vw,34px)}.mh small{display:block;font-size:12px;letter-spacing:.1em;color:var(--blue);font-weight:600;margin-top:6px}
.sz{display:flex;gap:10px;font-size:13px;font-weight:600;color:var(--mute)}
.sz span{width:84px;text-align:right}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.row b{font-weight:500;font-size:17px}
.pr{display:flex;gap:10px;font-weight:600;color:var(--green-d);font-variant-numeric:tabular-nums}
.pr span{width:84px;text-align:right}
.note{margin-top:14px;padding:12px 16px;background:var(--bg);border-radius:14px;font-size:14px;color:var(--mute);font-style:italic}
.desc{padding:10px 0 0;color:var(--mute)}
.foot{text-align:center;margin-top:20px;color:var(--mute);font-size:15px}
@media(max-width:520px){.mp{padding:20px 18px}.sz span,.pr span{width:64px;font-size:14px}.row b{font-size:16px}}
/* about */
.ag{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ag p{color:var(--mute);margin-bottom:14px}
.art{aspect-ratio:1/1;border-radius:34px;background:var(--green);position:relative;overflow:hidden;display:grid;place-items:center}
.art svg{width:70%}
@media(max-width:820px){.ag{grid-template-columns:1fr;gap:32px}.art{aspect-ratio:1/.7}}
/* highlight */
.hl{background:var(--green-d);color:#f4efe2}
.hl .lead{color:#c9d3c5}.hl .tag{color:#d9c28a}
.hlg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px}
.hc{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:20px;transition:.25s}
.hc:hover{background:rgba(255,255,255,.12)}
.hc .im{aspect-ratio:1/1.1;border-radius:16px;background:#e7dcc3;display:flex;align-items:flex-end;justify-content:center;margin-bottom:16px;overflow:hidden}
.hc .im svg{width:52%;max-width:120px}
.hc h3{font-size:22px;margin-bottom:6px}.hc p{font-size:14px;color:#c9d3c5}
@media(max-width:900px){.hlg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.hlg{grid-template-columns:1fr}}
/* why */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px}
.wc{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:26px 22px}
.wc svg{width:34px;height:34px;stroke:var(--green);fill:none;stroke-width:1.6;margin-bottom:14px}
.wc h3{font-size:21px;margin-bottom:6px}.wc p{font-size:14px;color:var(--mute)}
@media(max-width:900px){.why{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.why{grid-template-columns:1fr}}
/* steps */
.steps{background:var(--beige)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0 30px;counter-reset:s}
.st{background:var(--card);border-radius:var(--r);padding:26px;border:1px solid var(--line);counter-increment:s}
.st:before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--green-d);color:#fff;font-family:var(--serif);margin-bottom:14px}
.st h3{font-size:20px}
@media(max-width:700px){.sg{grid-template-columns:1fr}}
/* contact */
.cbox{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.cl{display:grid;gap:14px;font-size:15px}
.cl div{padding:14px 18px;background:var(--bg);border-radius:16px}
.cl small{display:block;color:var(--mute);font-size:12px}
.cl b{font-weight:600;font-size:17px}
@media(max-width:820px){.cbox{grid-template-columns:1fr}}
/* ig */
.igh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.igh p{color:var(--mute)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.ig div{aspect-ratio:1/1;border-radius:16px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;transition:.25s;position:relative}
.ig div:hover{transform:scale(1.02)}
.ig span{position:absolute;left:10px;top:8px;font-size:12px;font-weight:600;color:rgba(42,45,43,.7)}
.ig svg{width:34%;max-width:90px}
@media(min-width:820px){.ig{grid-template-columns:repeat(6,1fr)}.ig div:nth-child(n+7){display:none}}
/* footer */
footer{background:#2a2d2b;color:#d9d6cb;padding:56px 0 28px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer .logo{color:#f4efe2;display:block;margin-bottom:8px}
footer p{font-size:14px;color:#a9a99f}
footer h4{font:600 14px var(--sans);color:#f4efe2;margin-bottom:10px}
footer li{list-style:none;padding:3px 0;font-size:14px}footer ul{padding:0}
footer a:hover{color:#fff}
.soc{display:flex;gap:10px;margin-top:6px}
.soc a{width:42px;height:42px;border-radius:50%;border:1px solid #55584f;display:grid;place-items:center;transition:.2s}
.soc a:hover{background:var(--green);border-color:var(--green)}
.soc svg{width:19px;height:19px;stroke:#f4efe2;fill:none;stroke-width:1.7}
.cp{border-top:1px solid #44473f;margin-top:36px;padding-top:20px;font-size:13px;color:#8c8c82}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
.stage{background:radial-gradient(circle at 30% 20%,#f3ead6,#dccfae 70%);box-shadow:inset 0 0 0 1px var(--line)}
.stage:before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:var(--green);opacity:.18;top:6%;left:15%;filter:blur(2px)}
.stage svg{filter:drop-shadow(0 14px 10px rgba(42,45,43,.18))}
.chip{position:absolute;z-index:2;background:rgba(251,248,241,.94);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.c1{top:9%;left:6%}.c2{bottom:20%;right:5%}
.in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}.in2{animation-delay:.12s}.in3{animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.pc{box-shadow:0 1px 0 rgba(0,0,0,.02)}.pc:hover{box-shadow:0 18px 34px -18px rgba(63,90,61,.45)}
.pi{background:linear-gradient(180deg,#efe6d2,#e3d8bf);position:relative}
.pi svg{width:52%;max-width:130px;filter:drop-shadow(0 8px 6px rgba(42,45,43,.18));transition:transform .35s}
.pc:hover .pi svg{transform:scale(1.06) rotate(-2deg)}
.pi img,.im img,.ig img{width:100%;height:100%;object-fit:cover}
.row{align-items:center}.row .nm{display:flex;align-items:center;gap:14px}
.th{width:44px;height:56px;border-radius:12px;background:var(--bg);display:flex;align-items:flex-end;justify-content:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.th svg{width:70%;margin-bottom:-1px}
.row:hover .th{border-color:var(--green)}
.mp{box-shadow:0 24px 50px -30px rgba(42,45,43,.35)}
.tab:hover{border-color:var(--green)}
.hc .im{background:linear-gradient(180deg,#efe6d2,#ddd0b2)}.hc .im svg{filter:drop-shadow(0 10px 8px rgba(0,0,0,.2))}
.art{background:linear-gradient(150deg,#6d8b69,#3f5a3d)}
@media(max-width:520px){.th{width:36px;height:46px}.row .nm{gap:10px}.chip{font-size:12px}}
.stage img.hp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;z-index:1}
.stage:has(.hp):before{display:none}.stage:has(.hp) .chip{z-index:3}
.th img{width:100%;height:100%;object-fit:cover}
.pi{padding-top:0}.pi img{transition:transform .5s}.pc:hover .pi img{transform:scale(1.05)}
.ig div{background:var(--beige);overflow:hidden}.ig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.ig div:hover img{transform:scale(1.06)}
.ig span{z-index:2;left:8px;top:auto;bottom:8px;right:8px;background:rgba(251,248,241,.92);padding:3px 9px;border-radius:999px;font-size:11px;width:fit-content;color:var(--ink)}
.hc .im img{border-radius:16px}.hc .im{aspect-ratio:1/1.1}
</style></head>
